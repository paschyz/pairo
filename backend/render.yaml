services:
  - type: web
    name: pairo-api
    runtime: python
    rootDir: backend
    buildCommand: pip install . && python -c "import pairo; print(pairo.__file__)" && ls -la /opt/render/project/src/src/
    startCommand: PYTHONPATH=/opt/render/project/src/src uvicorn pairo.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
